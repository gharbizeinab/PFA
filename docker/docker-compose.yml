version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: medical_postgres
    environment:
      POSTGRES_DB: medical_db
      POSTGRES_USER: medical_user
      POSTGRES_PASSWORD: med_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../scripts/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U medical_user -d medical_db"]
      interval: 10s; timeout: 5s; retries: 5

  redis:
    image: redis:7-alpine
    container_name: medical_redis
    ports: ["6379:6379"]
    volumes: [redis_data:/data]

  flask_app:
    build: {context: .., dockerfile: docker/Dockerfile}
    container_name: medical_flask
    ports: ["5000:5000"]
    environment:
      - DATABASE_URL=postgresql://medical_user:med_pass@postgres:5432/medical_db
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}

volumes:
  postgres_data:
  redis_data:
